          membersList: payloadData.membersList || membersList,
          pendingDataChanges: payloadData.pendingDataChanges || pendingDataChanges,
          activityLogs: payloadData.activityLogs || activityLogs
        };
        if (db) {
          db.collection('artifacts').doc('gialai-qh-default').collection('config').doc('data').set(payload, { merge: true })
            .catch(err => console.warn('Lỗi Cloud:', err));
        }
      };

      // Realtime listener
      useEffect(() => {
        if (!db) return;
        const unsub = db.collection('artifacts').doc('gialai-qh-default').collection('config').doc('data')
          .onSnapshot(doc => {
            if (doc.exists) {
              const c = doc.data();
              if (c) {
                if (c.qhCh) setData(c.qhChung);
                if (c.qhChiTiet) setDetailData(c.qhChiTiet);
                if (c.qhPhanKhu) setPhankhuData(c.qhPhanKhu);
                if (c.adminPassword) setAdminPassword(c.adminPassword);
                if (c.membersList) setMembersList(c.membersList);
              }
            } else {
              syncToCloud();
            }
          });
        return () => unsub();
      }, []);

      useEffect(() => { localStorage.setItem('gialai_qh_chung', JSON.stringify(data)); }, [data]);
      useEffect(() => { localStorage.setItem('gialai_qh_chitiet', JSON.stringify(detailData)); }, [detailData]);
      useEffect(() => { localStorage.setItem('gialai_qh_phankhu', JSON.stringify(phankhuData)); }, [phankhuData]);

      const filteredData = useMemo(() => {
        return (data || []).filter(item => {
          const matchSearch = (item.xa||'').toLowerCase().includes(searchTerm.toLowerCase()) || (item.tenQh||'').toLowerCase().includes(searchTerm.toLowerCase());
          const matchHuyen = filterHuyen === '' ? true : item.huyen === filterHuyen;
          return matchSearch && matchHuyen;
        });
      }, [data, searchTerm, filterHuyen]);

      return (
        <div className="h-screen w-full bg-slate-100 flex flex-col overflow-hidden">
          {notification && (
            <div className="fixed bottom-4 right-4 bg-emerald-600 text-white px-4 py-3 rounded-lg shadow-xl z-50 flex items-center gap-2">
              <CheckCircle className="w-5 h-5"/><span>{notification}</span>
            </div>
          )}

          <header className="bg-blue-800 text-white p-4 shadow-md flex justify-between items-center shrink-0">
            <div>
              <h1 className="text-xl font-bold">CSDL QUY HOẠCH GIA LAI</h1>
              <p className="text-xs text-blue-200">Phòng Quy hoạch Kiến trúc và Phát triển đô thị - Sở Xây dựng Gia Lai</p>
            </div>
            <div>
              {isLoggedIn ? (
                <div className="flex items-center gap-3">
                  <span className="text-sm font-bold">{currentUser?.fullName} ({userRole})</span>
                  <button onClick={() => { setIsLoggedIn(false); setUserRole('GUEST'); showNotification('Đã đăng xuất'); }} className="bg-red-500 px-3 py-1 rounded text-xs font-bold">Đăng xuất</button>
                </div>
              ) : (
                <button onClick={() => setIsLoggedIn(true) || setUserRole('ADMIN') || setCurrentUser({fullName: 'Quản trị viên'})} className="bg-emerald-500 px-3 py-1.5 rounded text-sm font-bold">Đăng nhập Admin</button>
              )}
            </div>
          </header>

          <div className="bg-white border-b px-3 pt-2 flex gap-2 shrink-0">
            <button onClick={() => setActiveTab('MAIN')} className={`pb-2 px-3 font-bold text-sm border-b-2 ${activeTab === 'MAIN' ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500'}`}>QUY HOẠCH CHUNG</button>
          </div>

          <main className="flex-1 p-4 flex flex-col min-h-0 overflow-hidden">
            {activeTab === 'MAIN' && (
              <div className="flex flex-col flex-1 min-h-0 gap-4">
                <div className="bg-white p-4 rounded-xl shadow-sm border flex gap-3 shrink-0">
                  <input type="text" className="border px-3 py-2 rounded text-sm w-64 bg-white" placeholder="Tìm kiếm xã, tên QH..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                  <select className="border px-3 py-2 rounded text-sm bg-white" value={filterHuyen} onChange={e => setFilterHuyen(e.target.value)}>
                    <option value="">- Tất cả Huyện -</option>
                    {OLD_REGIONS.flatMap(p => p.districts).map(d => <option key={d.name} value={d.name}>{d.name}</option>)}
                  </select>
                </div>

                <div className="bg-white rounded-xl shadow-sm border flex-1 h-[65vh] flex flex-col relative overflow-hidden">
                  <div className="p-3 border-b bg-slate-50 flex justify-between items-center shrink-0">
                    <h2 className="font-bold text-blue-900 text-sm">DANH SÁCH QUY HOẠCH CHUNG</h2>
                    <span className="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Hiển thị: {filteredData.length}</span>
                  </div>
                  <div className="overflow-auto flex-1 custom-scrollbar w-full">
                    <table className="freeze-cols w-max min-w-full divide-y border-collapse text-sm">
                      <thead className="bg-slate-100 sticky top-0 z-10">
                        <tr>
                          {COLUMNS.map(col => <th key={col.key} className={`px-3 py-3 text-left text-xs font-bold uppercase border-x bg-slate-200 ${col.width}`}>{col.label}</th>)}
                        </tr>
                      </thead>
                      <tbody className="bg-white divide-y">
                        {filteredData.map((row, index) => (
                          <tr key={row.id} className="hover:bg-blue-50">
                            <td className="px-3 py-2 text-center border-x">{index + 1}</td>
                            {COLUMNS.slice(1).map(col => (
                              <td key={col.key} className={`px-3 py-2 border-x whitespace-normal ${col.width}`}>
                                {row[col.key] || '---'}
                              </td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
