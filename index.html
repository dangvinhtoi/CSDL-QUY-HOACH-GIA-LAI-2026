<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSDL QUY HOẠCH GIA LAI</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone (Bắt buộc để dịch JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lucide-react@latest"></script>

  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    @media print {
      body * { visibility: hidden; }
      .print-area, .print-area * { visibility: visible; }
      .print-area { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">

  <!-- PHẦN TỬ CHỨA APP REACT -->
  <div id="root">
    <div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; color:#475569; flex-direction:column; gap:12px;">
      <div style="font-size:18px; font-weight:bold; color:#1e3a8a;">⏳ Đang khởi chạy CSDL QUY HOẠCH GIA LAI...</div>
      <div style="font-size:13px; color:#64748b;">Hệ thống đang nạp dữ liệu và kiểm tra kết nối Server. Vui lòng chờ trong giây lát.</div>
    </div>
  </div>

  <!-- THẺ SCRIPT CHỨA MÃ REACT JSX -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // LẤY CÁC ICONS TỪ LUCIDE REACT
    const LucideIcons = window.LucideReact || {};
    const Plus = LucideIcons.Plus || (() => null);
    const X = LucideIcons.X || (() => null);
    const FileText = LucideIcons.FileText || (() => null);
    const Upload = LucideIcons.Upload || (() => null);
    const RefreshCcw = LucideIcons.RefreshCcw || (() => null);
    const ClipboardCheck = LucideIcons.ClipboardCheck || (() => null);
    const Download = LucideIcons.Download || (() => null);
    const User = LucideIcons.User || (() => null);
    const CheckCircle = LucideIcons.CheckCircle || (() => null);
    const Trash2 = LucideIcons.Trash2 || (() => null);
    const Clock = LucideIcons.Clock || (() => null);
    const AlertTriangle = LucideIcons.AlertTriangle || (() => null);

    function App() {
      // States cho Modals và Form
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingRecord, setEditingRecord] = useState(null);

      const [isMergeModalOpen, setIsMergeModalOpen] = useState(false);
      const [editingMergeRecord, setEditingMergeRecord] = useState(null);
      const [mergeFormData, setMergeFormData] = useState({ tinhCu: 'Gia Lai', huyen: '', xaMoi: '', cacXaCuStr: '', canCu: '' });

      const [isContactModalOpen, setIsContactModalOpen] = useState(false);
      const [editingContactRecord, setEditingContactRecord] = useState(null);
      const [contactFormData, setContactFormData] = useState({});

      const [isReviewModalOpen, setIsReviewModalOpen] = useState(false);
      const [editingReviewRecord, setEditingReviewRecord] = useState(null);
      const [reviewFormData, setReviewFormData] = useState({ tinhCu: 'Gia Lai', huyen: '', noiDung: '', coQuan: '', trangThai: 'Chưa rà soát', file: '', ghiChu: '' });

      const [reportModal, setReportModal] = useState({ isOpen: false, type: '' });
      const [showGeneratedReport, setShowGeneratedReport] = useState(false);
      const [reportFile, setReportFile] = useState(null);
      const [reportProgress, setReportProgress] = useState(0);
      const [reportStatus, setReportStatus] = useState('');

      const [showMemberMgmtModal, setShowMemberMgmtModal] = useState(false);
      const [membersList, setMembersList] = useState([
        { id: '1', fullName: 'Nguyễn Văn A', username: 'nguyenvana', status: 'PENDING', unit: 'Sở Xây Dựng', position: 'Chuyên viên', email: 'nva@gialai.gov.vn', createdAt: '2026-09-28' }
      ]);

      const [showContentApprovalModal, setShowContentApprovalModal] = useState(false);
      const [pendingDataChanges, setPendingDataChanges] = useState([]);

      const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: '', message: '', onConfirm: () => {} });
      const closeConfirm = () => setConfirmDialog(prev => ({ ...prev, isOpen: false }));

      const statsOverview = { total: 10, approved: 7, approvedPercent: '70.0' };
      const detailedStats = { 'Gia Lai': [{ total: 10, approved: 7 }] };

      // Handlers xử lý sự kiện
      const handleSaveMerge = (e) => { e.preventDefault(); setIsMergeModalOpen(false); };
      const handleSaveContact = (e) => { e.preventDefault(); setIsContactModalOpen(false); };
      const handleSaveReview = (e) => { e.preventDefault(); setIsReviewModalOpen(false); };
      
      const handleGenerateSmartReport = () => {
        setReportProgress(50);
        setReportStatus('Đang tổng hợp số liệu...');
        setTimeout(() => { setReportProgress(100); setShowGeneratedReport(true); }, 800);
      };

      const handleApproveMember = (id) => {
        setMembersList(prev => prev.map(m => m.id === id ? { ...m, status: 'APPROVED' } : m));
      };

      const handleRejectMember = (id) => {
        setMembersList(prev => prev.filter(m => m.id !== id));
      };

      const handleApproveContent = (item) => {
        setPendingDataChanges(prev => prev.filter(p => p.id !== item.id));
      };

      const handleRejectContent = (id) => {
        setPendingDataChanges(prev => prev.filter(p => p.id !== id));
      };

      return (
        <div className="min-h-screen p-4 md:p-8">
          <header className="mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
            <h1 className="text-xl font-bold text-blue-900">CSDL QUY HOẠCH GIA LAI</h1>
            <div className="flex gap-2">
              <button onClick={() => setReportModal({ isOpen: true, type: 'CHUNG' })} className="px-3 py-2 bg-emerald-600 text-white rounded-lg text-sm font-semibold flex items-center gap-1">
                <FileText className="w-4 h-4" /> Báo cáo chung
              </button>
              <button onClick={() => setShowMemberMgmtModal(true)} className="px-3 py-2 bg-purple-600 text-white rounded-lg text-sm font-semibold flex items-center gap-1">
                <User className="w-4 h-4" /> Thành viên
              </button>
            </div>
          </header>

          <main className="bg-white p-6 rounded-xl border shadow-sm mb-6">
            <p className="text-slate-600">Hệ thống quản lý cơ sở dữ liệu quy hoạch tỉnh Gia Lai sẵn sàng hoạt động.</p>
          </main>

          {/* MODAL SÁP NHẬP */}
          {isMergeModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in">
                <div className="flex justify-between items-center p-3 sm:p-4 border-b bg-amber-50 rounded-t-xl shrink-0">
                  <h3 className="font-bold text-amber-800 uppercase text-xs sm:text-sm md:text-base">{editingMergeRecord ? `Cập nhật sáp nhập` : 'Thêm mới dữ liệu sáp nhập'}</h3>
                  <button onClick={() => setIsMergeModalOpen(false)} className="text-slate-400 hover:text-slate-700 bg-white p-1.5 rounded-full shadow-sm"><X className="h-5 w-5" /></button>
                </div>
                <div className="overflow-y-auto p-3 sm:p-5 bg-slate-50/50 flex-1 custom-scrollbar">
                  <form id="merge-form" onSubmit={handleSaveMerge} className="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 bg-white p-3 sm:p-5 rounded-xl border shadow-sm max-w-full">
                    <div><label className="block text-xs font-semibold mb-1">Tỉnh cũ</label><select value={mergeFormData.tinhCu || ''} onChange={(e) => setMergeFormData(prev => ({...prev, tinhCu: e.target.value}))} className="w-full px-3 py-2 border rounded font-medium text-sm"><option value="Bình Định">Bình Định</option><option value="Gia Lai">Gia Lai</option></select></div>
                    <div><label className="block text-xs font-semibold mb-1">Huyện/Thị xã</label><input type="text" value={mergeFormData.huyen || ''} onChange={(e) => setMergeFormData(prev => ({...prev, huyen: e.target.value}))} className="w-full px-3 py-2 border rounded text-sm" required placeholder="Vd: Huyện Tuy Phước" /></div>
                    <div><label className="block text-xs font-semibold mb-1">Tên Xã/Phường MỚI</label><input type="text" value={mergeFormData.xaMoi || ''} onChange={(e) => setMergeFormData(prev => ({...prev, xaMoi: e.target.value}))} className="w-full px-3 py-2 border rounded font-bold text-emerald-700 text-sm" required placeholder="Vd: Xã Tuy Phước" /></div>
                    <div><label className="block text-xs font-semibold mb-1">Các Xã/Phường/Thị trấn CŨ (Ngăn cách bằng dấu phẩy)</label><textarea rows="3" value={mergeFormData.cacXaCuStr || ''} onChange={(e) => setMergeFormData(prev => ({...prev, cacXaCuStr: e.target.value}))} className="w-full px-3 py-2 border rounded text-sm" placeholder="Vd: Thị trấn Diêu Trì, Thị trấn Tuy Phước..." required /></div>
                    <div><label className="block text-xs font-semibold mb-1">Căn cứ pháp lý</label><input type="text" value={mergeFormData.canCu || ''} onChange={(e) => setMergeFormData(prev => ({...prev, canCu: e.target.value}))} className="w-full px-3 py-2 border rounded text-sm" required /></div>
                  </form>
                </div>
                <div className="p-4 border-t bg-slate-100 flex justify-end gap-3 rounded-b-xl shrink-0">
                  <button type="button" onClick={() => setIsMergeModalOpen(false)} className="px-5 py-2 text-sm bg-white border rounded font-semibold">Hủy bỏ</button>
                  <button type="submit" form="merge-form" className="px-6 py-2 text-sm bg-amber-500 hover:bg-amber-600 text-white rounded font-semibold flex items-center gap-2"><Plus className="h-4 w-4" /> {editingMergeRecord ? 'Lưu' : 'Thêm'}</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DANH BẠ */}
          {isContactModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-"><div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in"><div className="flex justify-between items-center p-3 sm:p-4 border-b bg-cyan-50 rounded-t-xl shrink-0"><h3 className="font-bold text-cyan-800 uppercase text-xs sm:text-sm md:text-base">{editingContactRecord ? 'Cập nhật liên hệ' : 'Thêm mới liên hệ'}</h3><button onClick={() => setIsContactModalOpen(false)} className="text-slate-400 hover:text-slate-700 bg-white p-1.5 rounded-full"><X className="h-5 w-5" /></button></div><div className="overflow-y-auto p-3 sm:p-5 bg-slate-50/50 flex-1 custom-scrollbar"><form id="contact-form" onSubmit={handleSaveContact} className="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 bg-white p-3 sm:p-5 rounded-xl border max-w-full">
              <div className="col-span-full"><label className="block text-xs font-semibold mb-1">Đơn vị (Huyện/Xã) <span className="text-red-500">*</span></label><input type="text" value={contactFormData.donVi || ''} onChange={e => setContactFormData(prev => ({...prev, donVi: e.target.value}))} className="w-full px-3 py-2 border rounded text-sm" required /></div>
              <div><label className="block text-xs font-semibold mb-1">Họ và tên <span className="text-red-500">*</span></label><input type="text" value={contactFormData.hoTen || ''} onChange={e => setContactFormData(prev => ({...prev, hoTen: e.target.value}))} className="w-full px-3 py-2 border rounded text-sm font-bold text-cyan-800" required /></div>
              <div><label className="block text-xs font-semibold mb-1">Điện thoại</label><input type="text" value={contactFormData.dienThoai || ''} onChange={e => setContactFormData(prev => ({...prev, dienThoai: e.target.value}))} className="w-full px-3 py-2 border rounded text-sm" /></div>
              <div><label className="block text-xs font-semibold mb-1">Chức danh</label><input type="text" value={contactFormData.chucDanh || ''} onChange={e => setContactFormData(prev => ({...prev, chucDanh: e.target.value}))} className="w-full px-3 py-2 border rounded text-sm" /></div>
              <div><label className="block text-xs font-semibold mb-1">Email</label><input type="email" value={contactFormData.email || ''} onChange={e => setContactFormData(prev => ({...prev, email: e.target.value}))} className="w-full px-3 py-2 border rounded text-sm" /></div>
            </form></div><div className="p-4 border-t bg-slate-100 flex justify-end gap-3 rounded-b-xl"><button onClick={() => setIsContactModalOpen(false)} className="px-5 py-2 text-sm bg-white border rounded font-semibold">Hủy bỏ</button><button type="submit" form="contact-form" className="px-6 py-2 text-sm bg-cyan-600 text-white rounded font-semibold"><Plus className="h-4 w-4 inline mr-1" /> {editingContactRecord ? 'Lưu' : 'Thêm'}</button></div></div></div>
          )}

          {/* MODAL RÀ SOÁT */}
          {isReviewModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-"><div className="bg-white rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in"><div className="flex justify-between items-center p-3 sm:p-4 border-b bg-rose-50 rounded-t-xl shrink-0"><h3 className="font-bold text-rose-800 uppercase text-xs sm:text-sm md:text-base">{editingReviewRecord ? 'Cập nhật Nội dung Rà soát' : 'Thêm mới Nội dung Rà soát'}</h3><button onClick={() => setIsReviewModalOpen(false)} className="text-slate-400 hover:text-slate-700 bg-white p-1.5 rounded-full shadow-sm"><X className="h-5 w-5" /></button></div><div className="overflow-y-auto p-3 sm:p-5 bg-slate-50/50 flex-1 custom-scrollbar"><form id="review-form" onSubmit={handleSaveReview} className="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 bg-white p-3 sm:p-5 rounded-xl border shadow-sm max-w-full">
              <div><label className="block text-xs font-semibold mb-1">Tỉnh cũ</label><select value={reviewFormData.tinhCu || 'Gia Lai'} onChange={e => setReviewFormData(prev => ({...prev, tinhCu: e.target.value}))} className="w-full px-3 py-2 border rounded focus:ring-rose-500 font-medium text-sm"><option value="Bình Định">Bình Định</option><option value="Gia Lai">Gia Lai</option></select></div>
              <div><label className="block text-xs font-semibold mb-1">Huyện/Thị xã cũ <span className="text-red-500">*</span></label><input type="text" value={reviewFormData.huyen || ''} onChange={e => setReviewFormData(prev => ({...prev, huyen: e.target.value}))} className="w-full px-3 py-2 border rounded focus:ring-rose-500 text-sm" required placeholder="Vd: Huyện Đak Đoa" /></div>
              <div className="col-span-full"><label className="block text-xs font-semibold mb-1">Nội dung định hướng phát triển <span className="text-red-500">*</span></label><textarea rows="3" value={reviewFormData.noiDung || ''} onChange={e => setReviewFormData(prev => ({...prev, noiDung: e.target.value}))} className="w-full px-3 py-2 border rounded focus:ring-rose-500 text-sm font-semibold text-rose-800" required placeholder="Nhập nội dung rà soát..."></textarea></div>
              <div><label className="block text-xs font-semibold mb-1">Đơn vị phụ trách</label><input type="text" value={reviewFormData.coQuan || ''} onChange={e => setReviewFormData(prev => ({...prev, coQuan: e.target.value}))} className="w-full px-3 py-2 border rounded focus:ring-rose-500 text-sm" placeholder="Vd: Sở Xây dựng, UBND Huyện..." /></div>
              <div><label className="block text-xs font-semibold mb-1">Trạng thái rà soát</label><select value={reviewFormData.trangThai || 'Chưa rà soát'} onChange={e => setReviewFormData(prev => ({...prev, trangThai: e.target.value}))} className="w-full px-3 py-2 border rounded focus:ring-rose-500 font-medium text-sm"><option value="Chưa rà soát">Chưa rà soát</option><option value="Đang rà soát">Đang rà soát</option><option value="Đã hoàn thành">Đã hoàn thành</option></select></div>
              <div><label className="block text-xs font-semibold mb-1">Link tài liệu (Đính kèm)</label><input type="text" value={reviewFormData.file || ''} onChange={e => setReviewFormData(prev => ({...prev, file: e.target.value}))} className="w-full px-3 py-2 border rounded focus:ring-rose-500 text-sm" placeholder="Dán link Drive, OneDrive..." /></div>
              <div className="col-span-full"><label className="block text-xs font-semibold mb-1">Ghi chú</label><textarea rows="2" value={reviewFormData.ghiChu || ''} onChange={e => setReviewFormData(prev => ({...prev, ghiChu: e.target.value}))} className="w-full px-3 py-2 border rounded focus:ring-rose-500 text-sm"></textarea></div>
            </form></div><div className="p-4 border-t bg-slate-100 flex justify-end gap-3 rounded-b-xl shrink-0"><button type="button" onClick={() => setIsReviewModalOpen(false)} className="px-5 py-2 text-sm bg-white border rounded font-semibold">Hủy bỏ</button><button type="submit" form="review-form" className="px-6 py-2 text-sm bg-rose-600 text-white rounded font-semibold flex items-center gap-2"><Plus className="h-4 w-4" /> {editingReviewRecord ? 'Lưu' : 'Thêm'}</button></div></div></div>
          )}

          {/* BÁO CÁO THÔNG MINH MODAL & PREVIEW */}
          {reportModal.isOpen && !showGeneratedReport && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-"><div className="bg-white rounded-xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in"><div className={`p-3 sm:p-4 flex justify-between items-center text-white shrink-0 ${reportModal.type === 'CHUNG' ? 'bg-emerald-600' : 'bg-purple-600'}`}><h3 className="font-bold flex items-center gap-2"><FileText className="w-5 h-5"/> Báo cáo tự động</h3><button onClick={() => setReportModal({isOpen:false,type:''})} className="hover:bg-black/20 p-1.5 rounded-full"><X className="w-5 h-5"/></button></div><div className="p-4 sm:p-6 overflow-y-auto flex-1 custom-scrollbar flex flex-col gap-4"><div className="bg-slate-50 p-4 rounded-lg border text-sm text-slate-600"><p>Hệ thống tự động điền số liệu vào <b>File đề cương mẫu (PDF/DOCX)</b> của bạn.</p></div><div className="flex flex-col gap-2 mb-6"><label className="text-sm font-bold text-slate-700">Tải đề cương (PDF/DOCX)</label><div className="border-2 border-dashed border-slate-300 rounded-xl p-8 flex flex-col items-center justify-center bg-slate-50 cursor-pointer relative"><input type="file" accept=".pdf,.doc,.docx" className="absolute inset-0 w-full h-full opacity-0 z-10" onChange={(e) => setReportFile(e.target.files)} /><Upload className="w-10 h-10 text-slate-400 mb-3" />{reportFile ? (<div className="text-center"><p className="text-sm font-bold text-blue-600">{reportFile.name}</p></div>) : (<div className="text-center"><p className="text-sm font-bold text-slate-600">Kéo thả hoặc nhấn chọn file</p></div>)}</div></div>
            {reportProgress > 0 && (<div className="mb-4"><div className="flex justify-between text-xs font-bold text-slate-600 mb-1"><span>{reportStatus}</span><span>{reportProgress}%</span></div><div className="w-full bg-slate-200 rounded-full h-2.5"><div className={`h-2.5 rounded-full ${reportModal.type === 'CHUNG' ? 'bg-emerald-500' : 'bg-purple-500'}`} style={{ width: `${reportProgress}%` }}></div></div></div>)}
            <button onClick={handleGenerateSmartReport} disabled={reportProgress>0 && reportProgress<100} className={`w-full py-3 rounded-lg text-white font-bold flex items-center justify-center gap-2 ${reportProgress>0 && reportProgress<100 ? 'bg-slate-400 cursor-not-allowed' : (reportModal.type==='CHUNG'?'bg-emerald-600':'bg-purple-600')}`}>{reportProgress>0&&reportProgress<100 ? <RefreshCcw className="w-5 h-5 animate-spin" /> : <ClipboardCheck className="w-5 h-5" />}{reportProgress===0 ? 'Tạo báo cáo' : 'Đang xử lý...'}</button></div></div></div>
          )}

          {showGeneratedReport && (
            <div className="fixed inset-0 bg-slate-200 flex flex-col z-"><div className="bg-white px-6 py-3 border-b shadow-sm flex justify-between items-center shrink-0"><h2 className="font-bold">Bản xem trước Báo cáo</h2><div className="flex gap-3"><button onClick={() => { setShowGeneratedReport(false); setReportModal({isOpen:false,type:''}); }} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg text-sm">Đóng</button><button onClick={() => window.print()} className={`px-4 py-2 text-white font-semibold rounded-lg text-sm flex items-center gap-2 ${reportModal.type==='CHUNG'?'bg-emerald-600':'bg-purple-600'}`}><Download className="w-4 h-4" /> In PDF</button></div></div><div className="flex-1 overflow-auto p-4 flex justify-center custom-scrollbar print-area"><div className="bg-white w-full max-w-[210mm] min-h-[297mm] shadow-lg p-[20mm] text-slate-900 font-serif text-[14pt] leading-[1.5]"><div className="flex justify-between items-start mb-8 text-center font-bold"><div className="w-[40%]"><p className="text-[13pt] uppercase">SỞ XÂY DỰNG GIA LAI</p><p className="text-[12pt] font-semibold border-b border-black inline-block pb-0.5">PHÒNG QUY HOẠCH KIẾN TRÚC</p></div><div className="w-[60%]"><p className="text-[13pt]">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</p><p className="text-[13pt] border-b border-black inline-block pb-0.5">Độc lập - Tự do - Hạnh phúc</p></div></div><div className="text-center mb-10"><p className="text-[16pt] font-bold">BÁO CÁO TIẾN ĐỘ</p><p className="text-[14pt] font-bold uppercase">{reportModal.type === 'CHUNG' ? 'Lập Quy hoạch chung' : 'Phê duyệt Quy hoạch chi tiết 1/500'}</p><p className="italic text-[13pt] mt-1">(Cập nhật đến ngày {new Date().toLocaleDateString('vi-VN')})</p></div><div className="text-justify space-y-4"><p>Báo cáo tiến độ triển khai trên địa bàn:</p><p className="font-bold">1. Tổng quan:</p><ul className="list-disc pl-8 space-y-2"><li>Tổng số đang theo dõi: <b>{reportModal.type === 'CHUNG' ? statsOverview.total : (detailedStats['Gia Lai']?.reduce((acc, curr) => acc + curr.total, 0) || 0)}</b> đơn vị.</li><li>Số lượng đã phê duyệt: <b>{reportModal.type === 'CHUNG' ? statsOverview.approved : (detailedStats['Gia Lai']?.reduce((acc, curr) => acc + curr.approved, 0) || 0)}</b> đơn vị.</li><li>Tỷ lệ hoàn thành: <b>{reportModal.type === 'CHUNG' ? statsOverview.approvedPercent : ((((detailedStats['Gia Lai']?.reduce((acc, curr) => acc + curr.approved, 0) || 0) / (detailedStats['Gia Lai']?.reduce((acc, curr) => acc + curr.total, 0) || 1))) * 100).toFixed(1)}%</b>.</li></ul><p className="font-bold mt-6">2. Kế hoạch tiếp theo:</p><p>Đẩy nhanh tiến độ thẩm định, phê duyệt đối với hồ sơ còn tồn đọng.</p></div></div></div></div>
          )}

          {/* MODAL QUẢN LÝ THÀNH VIÊN */}
          {showMemberMgmtModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in">
                <div className="bg-purple-600 p-3 sm:p-4 flex justify-between items-center text-white shrink-0">
                  <h3 className="font-bold flex items-center gap-2 text-sm sm:text-base"><User className="w-5 h-5"/> Quản lý & Xét duyệt Thành viên</h3>
                  <button onClick={() => setShowMemberMgmtModal(false)} className="hover:bg-purple-700 p-1 rounded-full"><X className="w-5 h-5"/></button>
                </div>
                <div className="p-4 sm:p-6 overflow-y-auto flex-1 custom-scrollbar bg-slate-50">
                  {(membersList || []).length === 0 ? (
                    <div className="text-center py-8 text-slate-500 text-sm">Chưa có tài khoản thành viên nào.</div>
                  ) : (
                    <div className="flex flex-col gap-3">
                      {(membersList || []).map(member => (
                        <div key={member.id} className="bg-white border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-sm hover:border-purple-300 transition-colors">
                          <div className="flex flex-col gap-1 flex-1">
                            <div className="flex items-center gap-2 flex-wrap">
                              <span className="font-bold text-slate-800 text-base">{member.fullName}</span>
                              <span className="text-xs bg-purple-100 text-purple-800 font-semibold px-2 py-0.5 rounded">@{member.username}</span>
                              {member.status === 'APPROVED' ? (
                                <span className="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded flex items-center gap-1"><CheckCircle className="w-3 h-3"/> Đã duyệt</span>
                              ) : member.status === 'REJECTED' ? (
                                <span className="text-xs bg-red-100 text-red-800 font-bold px-2 py-0.5 rounded flex items-center gap-1"><X className="w-3 h-3"/> Từ chối</span>
                              ) : (
                                <span className="text-xs bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded animate-pulse flex items-center gap-1"><Clock className="w-3 h-3"/> Chờ duyệt</span>
                              )}
                            </div>
                            <div className="text-sm text-slate-600 grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1 mt-1">
                              <div><b>Đơn vị:</b> {member.unit} ({member.position})</div>
                              <div><b>Liên hệ:</b> {member.email}</div>
                              <div className="sm:col-span-2 text-xs text-slate-400">Đăng ký lúc: {member.createdAt}</div>
                            </div>
                          </div>
                          {member.status === 'PENDING' && (
                            <div className="flex items-center gap-2 w-full md:w-auto justify-end">
                              <button onClick={() => handleApproveMember(member.id)} className="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded text-sm font-bold flex items-center gap-1 shadow-sm"><CheckCircle className="w-4 h-4"/> Duyệt</button>
                              <button onClick={() => handleRejectMember(member.id)} className="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded text-sm font-bold flex items-center gap-1 shadow-sm"><Trash2 className="w-4 h-4"/> Xóa</button>
                            </div>
                          )}
                          {member.status === 'APPROVED' && (
                            <div className="flex items-center gap-2 w-full md:w-auto justify-end">
                              <button onClick={() => handleRejectMember(member.id)} className="bg-slate-200 hover:bg-red-500 hover:text-white text-slate-600 px-3 py-1.5 rounded text-sm font-bold flex items-center gap-1 shadow-sm transition-colors"><Trash2 className="w-4 h-4"/> Xóa TK</button>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL DUYỆT DỮ LIỆU TỪ THÀNH VIÊN */}
          {showContentApprovalModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in">
                <div className="bg-amber-600 p-3 sm:p-4 flex justify-between items-center text-white shrink-0">
                  <h3 className="font-bold flex items-center gap-2 text-sm sm:text-base"><ClipboardCheck className="w-5 h-5"/> Xét duyệt Dữ liệu từ Thành viên</h3>
                  <button onClick={() => setShowContentApprovalModal(false)} className="hover:bg-amber-700 p-1 rounded-full"><X className="w-5 h-5"/></button>
                </div>
                <div className="p-4 sm:p-6 overflow-y-auto flex-1 custom-scrollbar bg-slate-50">
                  {(pendingDataChanges || []).length === 0 ? (
                    <div className="text-center py-8 text-slate-500 text-sm">Không có dữ liệu nào đang chờ duyệt.</div>
                  ) : (
                    <div className="flex flex-col gap-4">
                      {(pendingDataChanges || []).map(item => (
                        <div key={item.id} className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm hover:border-amber-300 transition-colors">
                          <div className="bg-slate-100 p-3 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <div>
                              <div className="flex items-center gap-2">
                                <span className={`text-xs font-bold px-2 py-1 rounded text-white ${item.type === 'ADD' ? 'bg-emerald-500' : 'bg-blue-500'}`}>
                                  {item.type === 'ADD' ? '+ THÊM MỚI' : '📝 CẬP NHẬT'}
                                </span>
                                <span className="text-sm font-bold text-slate-700">
                                  {item.category === 'QH_CHUNG' ? 'Quy hoạch Chung' : item.category === 'QH_CHITIET' ? 'Quy hoạch Chi tiết' : item.category === 'MERGE' ? 'Sáp nhập ĐVHC' : item.category === 'CONTACT' ? 'Danh bạ' : 'Rà soát'}
                                </span>
                              </div>
                            </div>
                            <div className="text-xs text-slate-500 text-right">
                              Người gửi: <b>{item.submittedBy?.fullName}</b> ({item.submittedBy?.unit})<br/>Lúc: {item.submittedAt}
                            </div>
                          </div>
                          <div className="p-4">
                            <div className="bg-slate-50 border border-slate-200 rounded p-3 mb-4 max-h-40 overflow-y-auto text-xs font-mono text-slate-700 custom-scrollbar whitespace-pre-wrap">
                              {JSON.stringify(item.recordData, null, 2)}
                            </div>
                            <div className="flex items-center gap-2 justify-end">
                              <button onClick={() => handleApproveContent(item)} className="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded text-sm font-bold flex items-center gap-1 shadow-sm"><CheckCircle className="w-4 h-4"/> Phê duyệt & Đăng tải</button>
                              <button onClick={() => handleRejectContent(item.id)} className="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded text-sm font-bold flex items-center gap-1 shadow-sm"><Trash2 className="w-4 h-4"/> Từ chối</button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* DIALOG XÁC NHẬN CHUNG */}
          {confirmDialog.isOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm max-h-[90vh] flex flex-col overflow-y-auto custom-scrollbar p-4 sm:p-6 text-center">
                <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4"><AlertTriangle className="w-8 h-8" /></div>
                <h3 className="font-bold text-slate-800 mb-2">{confirmDialog.title}</h3>
                <p className="text-slate-600 text-sm mb-6">{confirmDialog.message}</p>
                <div className="flex gap-3 justify-center">
                  <button onClick={closeConfirm} className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg">Hủy</button>
                  <button onClick={confirmDialog.onConfirm} className="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg">Xác nhận</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // KHỞI CHẠY KHÓI MÃ REACT AN TOÀN
    document.addEventListener("DOMContentLoaded", () => {
      try {
        const container = document.getElementById('root');
        if (!container) throw new Error("Không tìm thấy thẻ div #root");

        if (window.ReactDOM && ReactDOM.createRoot) {
          const root = ReactDOM.createRoot(container);
          root.render(<App />);
        } else if (window.ReactDOM && ReactDOM.render) {
          ReactDOM.render(<App />, container);
        } else {
          throw new Error("Chưa tải xong thư viện React/ReactDOM.");
        }
      } catch (err) {
        console.error("Lỗi khởi chạy:", err);
        const rootElem = document.getElementById('root');
        if (rootElem) {
          rootElem.innerHTML = `<div style="padding:20px; color:red; font-family:sans-serif;">⚠️ Lỗi Khởi Chạy: ${err.message}</div>`;
        }
      }
    });
  </script>
</body>
</html>
