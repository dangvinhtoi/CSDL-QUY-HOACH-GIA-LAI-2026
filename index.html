    function App() {

        const local = localStorage.getItem('gialai_qh_chitiet');

        return local ? JSON.parse(local) : INITIAL_REVIEWS_DEFAULT;

      });

      // HÀM ĐỒNG BỘ LÊN FIREBASE CLOUD (LUÔN GHI NHẬN VÀ LƯU TOÀN BỘ)
      const syncToCloud = (overrides = {}) => {
        const payload = {
          qhChung: overrides.data || data,
          qhChiTiet: overrides.detailData || detailData,
          qhSapNhap: overrides.mergedData || mergedData,
          qhLienHe: overrides.contactData || contactData,
          qhRaSoat: overrides.reviewData || reviewData,
          qhPhanKhu: overrides.phankhuData || phankhuData,
          adminPassword: overrides.adminPassword || adminPassword,
          membersList: overrides.membersList || membersList,
          pendingDataChanges: overrides.pendingDataChanges || pendingDataChanges,
          activityLogs: overrides.activityLogs || activityLogs
        };

        if (db) {
          try {
            const appIdKey = typeof __app_id !== 'undefined' ? __app_id : 'gialai-qh-default';
            db.collection('artifacts').doc(appIdKey).collection('config').doc('data').set(payload, { merge: true })
              .then(() => console.log('✅ Đã đồng bộ thành công lên Firebase Cloud!'))
              .catch(err => console.warn('Lỗi lưu Firebase Cloud:', err));
          } catch(e) {
            console.warn('Lỗi kết nối DB:', e);
          }
        }
      };

      const fetchFromCloud = (isManual = false) => {
        if (!db) {
          if (isManual) showNotification('❌ Chưa kết nối Firebase!');
          return;
        }
        if (isManual) showNotification('Đang tải dữ liệu từ Firebase Cloud...');
        const appIdKey = typeof __app_id !== 'undefined' ? __app_id : 'gialai-qh-default';
        db.collection('artifacts').doc(appIdKey).collection('config').doc('data').get()
          .then(docSnap => {
            if (docSnap.exists) {
              const cloudData = docSnap.data();
              if (cloudData && typeof cloudData === 'object') {
                if (Array.isArray(cloudData.qhChung) && cloudData.qhChung.length > 0) setData(cloudData.qhChung);
                if (Array.isArray(cloudData.qhChiTiet) && cloudData.qhChiTiet.length > 0) setDetailData(cloudData.qhChiTiet);
                if (Array.isArray(cloudData.qhSapNhap) && cloudData.qhSapNhap.length > 0) setMergedData(cloudData.qhSapNhap);
                if (Array.isArray(cloudData.qhLienHe) && cloudData.qhLienHe.length > 0) setContactData(cloudData.qhLienHe);
                if (Array.isArray(cloudData.qhRaSoat) && cloudData.qhRaSoat.length > 0) setReviewData(cloudData.qhRaSoat);
                if (Array.isArray(cloudData.qhPhanKhu) && cloudData.qhPhanKhu.length > 0) setPhankhuData(cloudData.qhPhanKhu);
                if (cloudData.adminPassword) {
                  setAdminPassword(cloudData.adminPassword);
                  localStorage.setItem('gialai_admin_pass', cloudData.adminPassword);
                }
                if (Array.isArray(cloudData.membersList)) setMembersList(cloudData.membersList);
                if (Array.isArray(cloudData.pendingDataChanges)) setPendingDataChanges(cloudData.pendingDataChanges);
                if (isManual) showNotification('✅ Đã tải dữ liệu mới nhất từ Firebase Cloud về máy!');
              }
            } else {
              if (isManual) showNotification('⚠️ Trên Firebase Cloud chưa có dữ liệu.');
            }
          })
          .catch(err => {
            console.error(err);
            if (isManual) showNotification('❌ Lỗi kết nối Firebase!');
          });
      };

      // REALTIME LISTENER AN TOÀN TRÁNH MẤT DỮ LIỆU
      useEffect(() => {
        if (!db) return;
        if (auth && auth.signInAnonymously) {
          auth.signInAnonymously().catch(err => console.warn('Lỗi ẩn danh:', err));
        }
        const appIdKey = typeof __app_id !== 'undefined' ? __app_id : 'gialai-qh-default';
        const unsubFull = db.collection('artifacts').doc(appIdKey).collection('config').doc('data')
          .onSnapshot(docSnap => {
            if (docSnap.exists) {
              const cloudData = docSnap.data();
              if (cloudData && typeof cloudData === 'object') {
                if (Array.isArray(cloudData.qhChung) && cloudData.qhChung.length > 0) setData(cloudData.qhChung);
                if (Array.isArray(cloudData.qhChiTiet) && cloudData.qhChiTiet.length > 0) setDetailData(cloudData.qhChiTiet);
                if (Array.isArray(cloudData.qhSapNhap) && cloudData.qhSapNhap.length > 0) setMergedData(cloudData.qhSapNhap);
                if (Array.isArray(cloudData.qhLienHe) && cloudData.qhLienHe.length > 0) setContactData(cloudData.qhLienHe);
                if (Array.isArray(cloudData.qhRaSoat) && cloudData.qhRaSoat.length > 0) setReviewData(cloudData.qhRaSoat);
                if (Array.isArray(cloudData.qhPhanKhu) && cloudData.qhPhanKhu.length > 0) setPhankhuData(cloudData.qhPhanKhu);
                if (cloudData.adminPassword) {
                  setAdminPassword(cloudData.adminPassword);
                  localStorage.setItem('gialai_admin_pass', cloudData.adminPassword);
                }
                if (Array.isArray(cloudData.membersList)) setMembersList(cloudData.membersList);
                if (Array.isArray(cloudData.pendingDataChanges)) setPendingDataChanges(cloudData.pendingDataChanges);
              }
            } else {
              syncToCloud();
            }
          }, err => console.warn('Lỗi listener:', err));

        return () => { if (unsubFull) unsubFull(); };
      }, []);

      // TỰ ĐỘNG LƯU LOCALSTORAGE KHI CÓ THAY ĐỔI
      useEffect(() => { localStorage.setItem('gialai_qh_chung', JSON.stringify(data)); }, [data]);

      useEffect(() => { localStorage.setItem('gialai_qh_sapnhap', JSON.stringify(mergedData)); }, [mergedData]);
      useEffect(() => { localStorage.setItem('gialai_qh_lienhe', JSON.stringify(contactData)); }, [contactData]);
      useEffect(() => { localStorage.setItem('gialai_qh_rasoat', JSON.stringify(reviewData)); }, [reviewData]);

        syncToCloud({ data, detailData, mergedData, contactData, reviewData, phankhuData, adminPassword, membersList, pendingDataChanges, activityLogs });

      };

      const handlePullCloudToLocal = () => {
        fetchFromCloud(true);

      const handleSaveFirebaseConfig = (e) => {
        e.preventDefault();
        const input = (fbConfigInput || '').trim();
        if (!input) return showNotification('Vui lòng nhập mã Firebase JSON!');
        try {
          const parsed = JSON.parse(input);
          if (!parsed.apiKey || !parsed.projectId) {
            return showNotification('Lỗi: Cấu hình thiếu apiKey hoặc projectId!');
          }
          localStorage.setItem('gialai_firebase_config', JSON.stringify(parsed));
          showNotification('Đã lưu Cấu hình Firebase! Tải lại trang...');
          setTimeout(() => window.location.reload(), 1200);

          showNotification('Lỗi: Định dạng JSON không hợp lệ!');
